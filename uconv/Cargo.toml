[package]
name = "uconv"
version = "0.1.0"
edition = "2021"
authors = ["uconv contributors"]
description = "A fast, offline-capable unit converter for currency, temperature, length, weight, volume, and time"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/acrucspiru/learn-rust"
keywords = ["converter", "units", "currency", "cli", "temperature"]
categories = ["command-line-utilities"]

[[bin]]
name = "uconv"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP for currency rates (rustls so we don't depend on OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

# Serde / JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Timestamps for cache freshness
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# XDG-ish cache directory resolution
directories = "5"

# REPL line editing
rustyline = "14"

# Error plumbing
thiserror = "1"

# Colored output
owo-colors = "4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
